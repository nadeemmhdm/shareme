<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.05" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="128" fill="#090d16" />
  
  <!-- Outer glowing ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#cyberGrad)" stroke-width="6" stroke-dasharray="16 12" opacity="0.3" />

  <!-- Shield Shape -->
  <path d="M256 80 L390 140 C390 280 256 390 256 420 C256 390 122 280 122 140 Z" fill="url(#shieldGrad)" stroke="url(#cyberGrad)" stroke-width="12" stroke-linejoin="round" />

  <!-- Lightning Bolt / Fast Transfer Beam -->
  <path d="M276 170 L216 270 L266 270 L236 342 L306 242 L256 242 Z" fill="url(#cyberGrad)" filter="url(#glow)" />
  
  <!-- Peer Nodes -->
  <circle cx="170" cy="220" r="14" fill="#38bdf8" />
  <circle cx="342" cy="220" r="14" fill="#a855f7" />
  <line x1="184" y1="220" x2="220" y2="220" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-dasharray="4 4" />
  <line x1="292" y1="220" x2="328" y2="220" stroke="#a855f7" stroke-width="4" stroke-linecap="round" stroke-dasharray="4 4" />
</svg>
